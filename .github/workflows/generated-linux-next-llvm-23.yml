    - name: Build and boot x86_64 Arch Linux + LTO
      run: podman run --env GITHUB_ACTIONS --env GITHUB_WORKSPACE --pids-limit -1 --pull newer --rm --tty --volume $GITHUB_WORKSPACE:/work:ro ghcr.io/nathanchance/ci3-kernel-build-env:latest /work/runner/driver.py kernel-build -a x86_64 -b -k https://github.com/ClangBuiltLinux/linux_pkgbuild/raw/main/config.x86_64 CONFIG_LTO_CLANG_THIN=y -l 23 -t linux-next -r ${{ needs.initial_checks.outputs.revision }}
