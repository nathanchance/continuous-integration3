# DO NOT MODIFY MANUALLY!
# Regenerate with:
# $ generator/generate.py
name: linux-next / LLVM 23
'on': workflow_dispatch
permissions: read-all
jobs:
  initial_checks:
    name: Initial checks
    runs-on:
    - self-hosted
    - small
    outputs:
      revision: ${{ steps.genrev.outputs.revision }}
    steps:
    - name: Clone continuous-integration3
      uses: actions/checkout@v7
    - name: Generate pinned revision for linux-next
      id: genrev
      run: runner/driver.py generate-revision linux-next
    - name: Check that patches apply to linux-next
      run: podman run --env GITHUB_ACTIONS --env GITHUB_WORKSPACE --pids-limit -1 --pull newer --rm --tty --volume $GITHUB_WORKSPACE:/work:ro ghcr.io/nathanchance/ci3-kernel-build-env:latest /work/runner/driver.py check-patch-application -r ${{ steps.genrev.outputs.revision }} linux-next
