# DO NOT MODIFY MANUALLY!
# Regenerate with:
# $ generator/generate.py
name: smoke test (linux / LLVM 24)
'on': workflow_dispatch
permissions: read-all
jobs:
  initial_checks:
    name: Initial checks
    runs-on:
    - self-hosted
    - small
    outputs:
      revision: ${{ steps.genrev.outputs.revision }}
    steps:
    - name: Clone continuous-integration3
      uses: actions/checkout@v7
    - name: Generate pinned revision for linux
      id: genrev
      run: runner/driver.py generate-revision linux
    - name: Check that patches apply to linux
      run: podman run --env GITHUB_ACTIONS --env GITHUB_WORKSPACE --pids-limit -1 --pull newer --rm --tty --volume $GITHUB_WORKSPACE:/work:ro ghcr.io/nathanchance/ci3-kernel-build-env:latest /work/runner/driver.py check-patch-application -r ${{ steps.genrev.outputs.revision }} linux
  _000850dbe8550978e15a9104330fd4b3f0861aa8d9e7a6f967a68368b9146788:
    name: arm multi_v5_defconfig
    runs-on:
    - self-hosted
    - normal
    needs:
    - initial_checks
    steps:
    - name: Clone continuous-integration3
      uses: actions/checkout@v7
    - name: Build and boot arm multi_v5_defconfig
      run: podman run --env GITHUB_ACTIONS --env GITHUB_WORKSPACE --pids-limit -1 --pull newer --rm --tty --volume $GITHUB_WORKSPACE:/work:ro ghcr.io/nathanchance/ci3-kernel-build-env:latest /work/runner/driver.py kernel-build -a arm -b -k multi_v5_defconfig -l 24 -t linux -r ${{ needs.initial_checks.outputs.revision }}
