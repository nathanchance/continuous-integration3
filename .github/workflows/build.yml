name: build kernels
on: workflow_dispatch
jobs:
  build_arm_multi_v5_defconfig:
    name: Build and boot arm multi_v5_defconfig
    runs-on: [self-hosted, normal]
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: arm multi_v5_defconfig
      run: |
        podman run \
          --pull newer \
          --rm \
          --tty \
          --volume $GITHUB_WORKSPACE:/work:ro \
          ghcr.io/nathanchance/cbl-ci3-build-env:latest \
          /work/runner/driver.py -a arm -b -k multi_v5_defconfig

